          - heading "LOGISTICS" [level=2] [ref=f3e58]
          - heading "West Coast dwell time is the peak risk, not labor capacity" [level=2] [ref=f3e59]
          - paragraph [ref=f3e60]: Throughput per labor hour improved again in August, so the overtime request is buying schedule protection rather than fixing a productivity gap. The larger exposure is inbound container dwell, up 1.4 days, with two carriers adding congestion surcharges from the 24th. Worth asking whether some peak volume can be diverted to Grand Prairie before committing the full overtime line.
          - paragraph [ref=f3e61]: "Source: DC Operations Weekly — week 37"
