          - heading "MARKETING" [level=2] [ref=f3e64]
          - heading "Founder-voice posting is outperforming brand accounts 3x in the category" [level=2] [ref=f3e65]
          - paragraph [ref=f3e66]: Two competitors are already running circularity campaigns this quarter, which narrows the novelty window for the denim program. Category data shows founder-voice posts outperforming brand-account posts by about 3x on engagement, which supports Sam's request to publish the launch under the CEO's own profile rather than the brand account.
          - paragraph [ref=f3e67]: "Source: Competitor Watch Digest"
        - generic [ref=f3e68]:
          - heading "OPERATIONS" [level=2] [ref=f3e70]
          - heading "Southwest softness tracks the market, not execution" [level=2] [ref=f3e71]
          - paragraph [ref=f3e72]: Southwest comps are trailing at -1.1%, but the licensed traffic index shows the region running 2.0 points below the national line on weather-driven softness. That points to a traffic problem rather than a store execution problem, and argues against a regional intervention this month.
          - paragraph [ref=f3e73]: "Source: Mall Traffic and Comp Index"
